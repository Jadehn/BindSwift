{% extends "base.html" %}
{% block title %}Sign in · Bindswift Admin{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto">
  <h1>Admin sign in</h1>
  <p class="muted">Password plus the 6-digit code from your authenticator app.</p>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base }}/login" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="code">Authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
    <p><button class="btn btn-dark" style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
